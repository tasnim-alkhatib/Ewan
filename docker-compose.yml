version: "3.9"

services:
  # قاعدة بيانات PostgreSQL محلية جوه Docker - نفس نوع القاعدة اللي هتشتغل بيها فعليًا على Railway
  postgres:
    image: postgres:16-alpine
    container_name: ewan-postgres
    environment:
      POSTGRES_DB: "EwanDB"
      POSTGRES_USER: "ewan_admin"
      POSTGRES_PASSWORD: "Ewan_Strong_Pass123"
    ports:
      - "5432:5432"
    volumes:
      - ewan-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewan_admin -d EwanDB"]
      interval: 10s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ewan-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=EwanDB;Username=ewan_admin;Password=Ewan_Strong_Pass123"
      AzureStorage__ConnectionString: "PUT-YOUR-REAL-AZURE-STORAGE-CONNECTION-STRING-HERE"
      AzureStorage__ContainerName: "media"
      Jwt__Issuer: "EwanHrApi"
      Jwt__Audience: "EwanHrClient"
      Jwt__Key: "PUT-A-LONG-RANDOM-SECRET-HERE-AT-LEAST-32-CHARS"
    ports:
      - "8080:8080"

volumes:
  ewan-pg-data: